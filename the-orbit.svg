<svg width="560" height="540" viewBox="-40 -20 620 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="vignette" cx="42%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#d2a8ff"/>
      <stop offset="45%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#6e40c9"/>
    </radialGradient>
    <linearGradient id="cometStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="-40" y="-20" width="620" height="600" rx="12" fill="#0d1117"/>
  <rect x="-40" y="-20" width="620" height="600" rx="12" fill="url(#vignette)"/>
  <rect x="-40" y="-20" width="620" height="600" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <g fill="#8b949e">
    <circle cx="-10" cy="30" r="1.1"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="480" r="1.1"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="460" r="1"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="4.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="20" cy="230" r="1"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.5s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="280" y="18" text-anchor="middle" fill="#e6edf3" font-size="13" letter-spacing="3" font-weight="600">THE ORBIT</text>
  <text x="280" y="35" text-anchor="middle" fill="#8b949e" font-size="9.5" letter-spacing="0.5">4+ years, one trajectory — sized by real, public repositories</text>

  <circle cx="280" cy="300" r="80" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 4">
    <animate attributeName="stroke-dashoffset" from="0" to="502.7" dur="22s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="300" r="120" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 4">
    <animate attributeName="stroke-dashoffset" from="754" to="0" dur="28s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="300" r="160" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 4">
    <animate attributeName="stroke-dashoffset" from="0" to="1005.3" dur="34s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="300" r="200" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 4">
    <animate attributeName="stroke-dashoffset" from="1256.6" to="0" dur="40s" repeatCount="indefinite"/>
  </circle>

  <path id="cometPath" d="M107,400 C90,310 120,250 141,220 C190,150 280,160 340,196" fill="none" stroke="url(#cometStroke)" stroke-width="2.4" stroke-linecap="round"/>

  <circle r="2" fill="#79c0ff" filter="url(#glowSoft)" opacity="0">
    <animateMotion dur="7s" begin="-1.2s" repeatCount="indefinite"><mpath href="#cometPath"/></animateMotion>
    <animate attributeName="r" values="1.5;4;4;1.5" keyTimes="0;0.15;0.85;1" dur="7s" begin="-1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0.35;0" keyTimes="0;0.15;0.85;1" dur="7s" begin="-1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#79c0ff" filter="url(#glowSoft)" opacity="0">
    <animateMotion dur="7s" begin="-0.6s" repeatCount="indefinite"><mpath href="#cometPath"/></animateMotion>
    <animate attributeName="r" values="1.5;4;4;1.5" keyTimes="0;0.15;0.85;1" dur="7s" begin="-0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.15;0.85;1" dur="7s" begin="-0.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#e6f4ff" filter="url(#glow)" opacity="0">
    <animateMotion dur="7s" begin="0s" repeatCount="indefinite"><mpath href="#cometPath"/></animateMotion>
    <animate attributeName="r" values="2;5.5;5.5;2" keyTimes="0;0.15;0.85;1" dur="7s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <circle cx="280" cy="300" r="40" fill="url(#sun)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="300" r="40" fill="url(#sun)" stroke="#30363d" stroke-width="1"/>
  <text x="280" y="307" text-anchor="middle" fill="#0d1117" font-size="20" font-weight="700">BB</text>

  <circle cx="107" cy="400" r="17" fill="#39d353" filter="url(#glow)"/>
  <circle cx="107" cy="400" r="17" fill="#39d353" stroke="#30363d" stroke-width="1.5"/>
  <line x1="129" y1="416" x2="150" y2="428" stroke="#30363d" stroke-width="1"/>
  <text x="68" y="450" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">FRONTEND &amp; UI</text>
  <text x="68" y="463" text-anchor="middle" fill="#8b949e" font-size="9">19 repos · foundation</text>

  <circle cx="141" cy="220" r="13" fill="#26a641" filter="url(#glow)"/>
  <circle cx="141" cy="220" r="13" fill="#26a641" stroke="#30363d" stroke-width="1.5"/>
  <text x="102" y="192" text-anchor="end" fill="#e6edf3" font-size="11" font-weight="600">BACKEND &amp; SYSTEMS</text>
  <text x="102" y="205" text-anchor="end" fill="#8b949e" font-size="9">9 repos · the core</text>

  <circle cx="340" cy="196" r="15" fill="#006d32" filter="url(#glow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="196" r="15" fill="#006d32" stroke="#39d353" stroke-width="1.5"/>
  <text x="360" y="157" text-anchor="start" fill="#e6edf3" font-size="11" font-weight="600">AI / ML &amp; DATA</text>
  <text x="360" y="170" text-anchor="start" fill="#8b949e" font-size="9">8 repos · where I'm headed</text>

  <circle cx="320" cy="369" r="10" fill="#0e4429" stroke="#30363d" stroke-width="1.5"/>
  <line x1="329" y1="376" x2="336" y2="390" stroke="#30363d" stroke-width="1" stroke-dasharray="1 3"/>
  <text x="338" y="410" text-anchor="start" fill="#e6edf3" font-size="11" font-weight="600">CLOUD &amp; DEVOPS</text>
  <text x="338" y="423" text-anchor="start" fill="#8b949e" font-size="9">4 repos · quiet infra work</text>

  <g transform="translate(178,478)">
    <text x="0" y="6" fill="#8b949e" font-size="8">Less</text>
    <rect x="30" y="-6" width="10" height="10" rx="2" fill="#161b22" stroke="#30363d" stroke-width="0.5"/>
    <rect x="44" y="-6" width="10" height="10" rx="2" fill="#0e4429"/>
    <rect x="58" y="-6" width="10" height="10" rx="2" fill="#006d32"/>
    <rect x="72" y="-6" width="10" height="10" rx="2" fill="#26a641"/>
    <rect x="86" y="-6" width="10" height="10" rx="2" fill="#39d353"/>
    <text x="102" y="6" fill="#8b949e" font-size="8">More</text>
  </g>

  <text x="280" y="555" text-anchor="middle" fill="#484f58" font-size="8" letter-spacing="0.5">computed from public, non-fork repositories — github.com/mahi0601</text>
</svg>
